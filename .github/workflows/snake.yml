name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The first colour in color_dots is the empty cell. For the dark snake it
      # has to be a visible slate: against GitHub's #0d1117 a near-black empty
      # cell disappears and the whole grid looks broken.
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=0F766E&color_dots=#ebedf0,#c7d2fe,#a5b4fc,#7C3AED,#2563EB
            dist/github-snake-dark.svg?palette=github-dark&color_snake=38BDAE&color_dots=#2d3343,#4a5878,#7c5cbf,#BF91F3,#70A5FD

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
